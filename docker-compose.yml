# MAT-BOT — docker compose za Hetzner VPS (i lokalni run).
#
# VAŽNO PRIJE PRVOG DEPLOYA S OVIM FAJLOM: deploy workflow radi
# `git reset --hard origin/main` u VPS_APP_DIR — ako na VPS-u već postoji
# ručno održavan docker-compose.yml, OVAJ fajl će ga pregaziti.
# Uporedi (`diff`) postojeći VPS fajl sa ovim i uskladi prije merge-a.
#
# Pokretanje:  docker compose up -d --build
# Logovi:      docker compose logs -f
# Health:      curl -fsS http://127.0.0.1:8080/healthz

services:
  matbot:
    build: .
    image: matbot:latest
    restart: unless-stopped
    env_file: .env            # kopiraj .env.example → .env i popuni
    # OBAVEZNE RELEASE VARIJABLE — izričito proslijeđene.
    # Produkcija je jednom tiho radila BEZ MATBOT_PRACTICE_PIPELINE i
    # MATBOT_PRACTICE_DIFFICULTY_LEVELS, dok su release gate-ovi mjerili obje
    # uključene: klik na MCQ opciju je proradio tek kad su dodane i kontejner
    # ponovo kreiran. `env_file` ih prosljeđuje samo ako POSTOJE u .env, pa se
    # ovdje navode poimence — vrijednost i dalje dolazi iz .env, nikad odavde.
    # Očekivane vrijednosti drži deploy/production_release.env, koji upisuje
    # deploy workflow i provjerava matbot/release_config.py.
    environment:
      PORT: "8080"
      MATBOT_PRACTICE_PIPELINE: ${MATBOT_PRACTICE_PIPELINE:-}
      MATBOT_PRACTICE_DIFFICULTY_LEVELS: ${MATBOT_PRACTICE_DIFFICULTY_LEVELS:-}
      AI_TUTOR_TIMEOUT: ${AI_TUTOR_TIMEOUT:-}
      OPENAI_MODEL_TEXT: ${OPENAI_MODEL_TEXT:-}
      MATBOT_REASONING_EFFORT: ${MATBOT_REASONING_EFFORT:-}
      # Rollback ručke brze Practice rute. Podrazumijevana vrijednost je
      # UGRAĐENA u matbot/config.py (auditirana arhitektura), pa prazno ovdje
      # znači „ostavi ugrađeno“ — a ne tiho gašenje rute.
      MATBOT_FAST_SINGLE_CALL_SCOPE: ${MATBOT_FAST_SINGLE_CALL_SCOPE:-}
      MATBOT_FAST_SINGLE_CALL_EXCLUDE: ${MATBOT_FAST_SINGLE_CALL_EXCLUDE:-}
      MATBOT_DETERMINISTIC_VARIETY_GATE: ${MATBOT_DETERMINISTIC_VARIETY_GATE:-}
      # Rollback ručke Practice ponašanja. Ugrađena vrijednost je već
      # produkcijska, pa ih deploy upisuje radi VIDLJIVOSTI i vraćanja
      # auditiranog stanja — ne zato što bi izostanak sam po sebi mijenjao rutu.
      MATBOT_DETERMINISTIC_PRACTICE: ${MATBOT_DETERMINISTIC_PRACTICE:-}
      MATBOT_PRACTICE_SINGLE_HINT: ${MATBOT_PRACTICE_SINGLE_HINT:-}
      MATBOT_ARCHETYPE_ROTATION: ${MATBOT_ARCHETYPE_ROTATION:-}
      MATBOT_FORM_ROTATION: ${MATBOT_FORM_ROTATION:-}
      # Prekidač zatvorenog pada. Prazno (lokalni run) = start samo upozorava;
      # `enabled` (produkcija, upisuje deploy) = start ODBIJA pogrešnu
      # konfiguraciju. Vidi app.py i matbot/release_config.py.
      MATBOT_RELEASE_ENFORCEMENT: ${MATBOT_RELEASE_ENFORCEMENT:-}
    ports:
      - "127.0.0.1:8080:8080" # samo lokalno; javni saobraćaj ide kroz nginx
    volumes:
      - ./storage:/app/storage   # SQLite activity log preživi rebuild/restart
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
