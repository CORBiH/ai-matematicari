name: Deploy to Hetzner VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e

            cd "${{ secrets.VPS_APP_DIR }}"

            echo "Before deploy:"
            git log -1 --oneline || true

            git fetch origin main
            git reset --hard origin/main

            # CHECKOUT MORA BITI TAČNO PUSHANI COMMIT. Tiho zastarjeli remote
            # (ili pogrešan clone) do sada bi prošao kao „success“: build je
            # keširan, stari kontejner je zdrav, /healthz zelen. Odstupanje
            # sada pada GLASNO, prije nego što se išta gradi.
            if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
              echo "DEPLOY REFUSED: checkout $(git rev-parse HEAD) != pushed ${{ github.sha }}"
              exit 1
            fi

            VERSION=$(git rev-parse --short HEAD)
            echo "Deploying version: $VERSION"

            if grep -q '^APP_VERSION=' .env; then
              sed -i "s/^APP_VERSION=.*/APP_VERSION=$VERSION/" .env
            else
              echo "APP_VERSION=$VERSION" >> .env
            fi

            # AUDITIRANA PRACTICE KONFIGURACIJA — CIJELA, IZ JEDNOG IZVORA.
            #
            # Produkcijski .env zivi na serveru i nije u repou, pa varijabla
            # koja postoji samo u dokumentaciji nikad ne stigne do kontejnera:
            # produkcija bi tiho izvrsavala jednu arhitekturu dok su je kapije
            # mjerile u drugoj. Tako je i bilo — MATBOT_PRACTICE_PIPELINE i
            # MATBOT_PRACTICE_DIFFICULTY_LEVELS su nedostajale na VPS-u dok su
            # gate-ovi mjerili obje ukljucene, a ovaj korak je upisivao samo
            # dvije od potrebnih vrijednosti.
            #
            # Spisak vise NIJE ovdje: cita se iz deploy/production_release.env,
            # istog fajla koji cita i matbot/release_config.py, pa nova
            # vrijednost ima tacno jedno mjesto. Sama petlja je u
            # deploy/apply_release_env.sh da bi je testovi mogli POKRENUTI —
            # logika koja odlucuje sta produkcija izvrsava ne smije zivjeti
            # samo unutar heredoca koji nijedan test ne vidi. Idempotentno;
            # tajne u `.env` ostaju netaknute i nikad se ne ispisuju.
            sh deploy/apply_release_env.sh .env deploy/production_release.env

            docker compose build

            # KONFIGURACIJA SE PROVJERAVA PRIJE NEGO STO DIRAMO ZIVU USLUGU.
            # Provjera ide UNUTAR kontejnera, dakle kroz isto razrjesenje
            # konfiguracije koje ima i aplikacija (ukljucujuci ugradjene
            # vrijednosti poput izbora brzog modela). Pada zatvoreno: `set -e`
            # obara deploy prije `up -d`, pa pogresna konfiguracija nikad ne
            # zamijeni ispravnu koja trenutno radi.
            # KRITIČNO: `< /dev/null`. Cijela ova skripta stiže SSH-u kroz
            # STDIN (heredoc), a `docker compose run` (i exec) PRIKAČI stdin
            # na kontejner — docker klijent tada POJEDE OSTATAK SKRIPTE kao
            # ulaz kontejnera. IZMJERENA POSLJEDICA (2026-08-14 → 2026-08-15):
            # svaki deploy poslije uvođenja ove provjere završavao je TAČNO
            # OVDJE — `up -d` se više nikad nije izvršio, stari kontejner je
            # ostao da poslužuje (healthz zelen, workflow „success“), pa
            # učenici 30+ deployova nisu dobili nijednu novu verziju.
            docker compose run --rm --no-deps -T matbot \
              python -m matbot.release_config --require < /dev/null

            # SEMA SE MIGRIRA PRIJE ZAMJENE APLIKACIJE, NOVIM KODOM, U
            # KRATKOTRAJNOM KONTEJNERU KOJI JOS NE POSLUZUJE. Redoslijed je
            # sustinski:
            #
            #   stara aplikacija i dalje posluzuje
            #     -> migracija v2 -> v3 (aditivna: dodaje student_sessions)
            #     -> strukturna provjera
            #     -> tek onda `up -d`
            #
            # Zato ne postoji prozor u kojem nova aplikacija trazi tabelu
            # koje jos nema. Obrnut redoslijed bi ga garantovao.
            #
            # ADITIVNOST je ono sto ovo cini bezbjednim: stara aplikacija ne
            # cita `student_sessions` i ne pada zbog zapisa verzije 3, pa
            # smije nastaviti da radi i poslije migracije (dokazano testom
            # `test_v3_is_additive_for_the_currently_running_app`).
            #
            # `set -e` obara deploy OVDJE ako migracija ne uspije, PRIJE
            # `up -d` — stari kontejner ostaje netaknut i posluzuje dalje.
            # `< /dev/null` je OBAVEZAN: `docker compose run` prikaci stdin
            # na kontejner, a cijela skripta stize SSH-u kroz stdin — bez
            # toga docker pojede ostatak skripte (izmjereno 2026-08-14).
            docker compose run --rm --no-deps -T matbot \
              python -m matbot.reporting_db --migrate < /dev/null

            docker compose up -d --remove-orphans

            docker compose ps
            docker compose logs --tail=80

            echo "Waiting for app to become healthy..."
            for i in {1..20}; do
              if curl -fsS --max-time 10 http://127.0.0.1:8080/healthz > /dev/null; then
                echo "App is healthy"
                break
              fi

              echo "Health check attempt $i failed, waiting..."
              sleep 3

              if [ "$i" -eq 20 ]; then
                echo "Health check failed after 20 attempts"
                docker compose ps
                docker compose logs --tail=150
                exit 1
              fi
            done

            # DOKAZ NAD KONTEJNEROM KOJI STVARNO POSLUZUJE UCENIKE.
            # Provjera iznad je isla kroz `run --rm` (zaseban kratkotrajni
            # kontejner). Ovaj korak ispituje ZIVI proces i ispisuje njegovu
            # efektivnu ne-tajnu konfiguraciju u log workflowa, pa se poslije
            # deploya moze dokazati koju arhitekturu produkcija izvrsava — bez
            # SSH-a i bez ijedne tajne u izlazu.
            # KONTEJNER KOJI POSLUŽUJE MORA BITI IZ OVOG DEPLOYA. APP_VERSION
            # ulazi u okruženje kontejnera pri KREIRANJU (env_file), pa stara
            # vrijednost ovdje znači da `up -d` nije zamijenio kontejner —
            # tačno tihi kvar koji je ovaj workflow imao. Pada glasno.
            RUNNING_VERSION=$(docker compose exec -T matbot printenv APP_VERSION < /dev/null)
            if [ "$RUNNING_VERSION" != "$VERSION" ]; then
              echo "DEPLOY FAILED: running container has APP_VERSION=$RUNNING_VERSION, expected $VERSION"
              exit 1
            fi
            echo "Running container APP_VERSION: $RUNNING_VERSION"

            echo "Effective non-secret configuration of the running service:"
            docker compose exec -T matbot python -m matbot.release_config --require < /dev/null

            echo "Deployment successful: $VERSION"
          EOF

      # DOKAZ NAD JAVNIM DOMENOM, SA RUNNERA (ne kroz SSH): učenici ne
      # razgovaraju sa 127.0.0.1 nego sa https://bot.matematicari.com. Ako
      # domen poslužuje drugu mašinu ili stariji kontejner, ovo pada GLASNO —
      # zeleni interni healthz više nikad nije dokaz deploya.
      - name: Verify public domain serves this deploy
        run: |
          VERSION="$(echo "${{ github.sha }}" | cut -c1-7)"
          for i in 1 2 3 4 5 6; do
            SERVED=$(curl -fsS --max-time 15 https://bot.matematicari.com/healthz \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" || true)
            if [ "$SERVED" = "$VERSION" ]; then
              echo "Public domain serves version $SERVED"
              exit 0
            fi
            echo "Attempt $i: public domain serves '$SERVED', expected '$VERSION'"
            sleep 10
          done
          echo "DEPLOY FAILED: public domain never served $VERSION"
          exit 1